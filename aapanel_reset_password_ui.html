<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Reset mật khẩu WordPress qua aaPanel API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Reset mật khẩu WordPress qua aaPanel API</h4>
                </div>
                <div class="card-body">
                    <form id="resetForm">
                        <div class="mb-3">
                            <label class="form-label">aaPanel URL</label>
                            <input type="text" class="form-control" name="panel_url" required placeholder="https://your-aapanel-url">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">aaPanel User</label>
                            <input type="text" class="form-control" name="panel_user" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">aaPanel Password</label>
                            <input type="password" class="form-control" name="panel_pass" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Domain/ID Website</label>
                            <input type="text" class="form-control" name="site_id" required placeholder="domain.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tài khoản WordPress</label>
                            <input type="text" class="form-control" name="wp_user" required placeholder="admin">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mật khẩu mới</label>
                            <input type="text" class="form-control" name="wp_pass" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Reset mật khẩu</button>
                    </form>
                    <div id="result" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
document.getElementById('resetForm').onsubmit = async function(e) {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);
    const params = new URLSearchParams(formData);
    document.getElementById('result').innerHTML = '<div class="alert alert-info">Đang gửi yêu cầu...</div>';
    try {
        const res = await fetch('aapanel_wp_sites_manager.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('result').innerHTML = '<div class="alert alert-success">Đổi mật khẩu thành công!</div>';
        } else {
            document.getElementById('result').innerHTML = '<div class="alert alert-danger">Lỗi: ' + (data.error || 'Không xác định') + '</div>';
        }
    } catch (err) {
        document.getElementById('result').innerHTML = '<div class="alert alert-danger">Lỗi kết nối hoặc server!</div>';
    }
};
</script>
</body>
</html>
