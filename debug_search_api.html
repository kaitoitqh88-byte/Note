<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Search API Debug</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .console { 
            background: #000; 
            color: #0f0; 
            padding: 15px; 
            border-radius: 8px; 
            font-family: monospace; 
            height: 400px; 
            overflow-y: auto; 
            margin: 20px 0;
        }
        .test-section { 
            background: #f8f9fa; 
            padding: 20px; 
            margin: 20px 0; 
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-success { background: #28a745; }
        .status-error { background: #dc3545; }
        .status-warning { background: #ffc107; }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-bug me-2"></i>Search API Debug Tool</h1>
        <p>Công cụ debug để test search API và JavaScript functionality.</p>

        <!-- Test Controls -->
        <div class="test-section">
            <h3>🎛️ Test Controls</h3>
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="testQuery" class="form-label">Test Query:</label>
                        <input type="text" id="testQuery" class="form-control" value="test" placeholder="Nhập query để test">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="testStatus" class="form-label">Status Filter:</label>
                        <select id="testStatus" class="form-select">
                            <option value="">All statuses</option>
                            <option value="active">Active</option>
                            <option value="pending">Pending</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="testDirectAPI()">🔗 Test Direct API</button>
                <button class="btn btn-success" onclick="testSearchPage()">📄 Test Search Page</button>
                <button class="btn btn-info" onclick="testJavaScriptAPI()">⚡ Test JavaScript API</button>
                <button class="btn btn-warning" onclick="clearConsole()">🗑️ Clear Console</button>
            </div>
        </div>

        <!-- Status Indicators -->
        <div class="test-section">
            <h3>📊 Test Status</h3>
            <div class="row">
                <div class="col-md-4">
                    <div id="apiStatus" class="d-flex align-items-center">
                        <span class="status-indicator status-warning"></span>
                        <span>API: Not tested</span>
                    </div>
                </div>
                <div class="col-md-4">
                    <div id="jsStatus" class="d-flex align-items-center">
                        <span class="status-indicator status-warning"></span>
                        <span>JavaScript: Not tested</span>
                    </div>
                </div>
                <div class="col-md-4">
                    <div id="pageStatus" class="d-flex align-items-center">
                        <span class="status-indicator status-warning"></span>
                        <span>Page: Not tested</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Console Output -->
        <div class="test-section">
            <h3>💻 Console Output</h3>
            <div id="console" class="console">
                [DEBUG] Console ready...\n
            </div>
        </div>

        <!-- Test Results -->
        <div class="test-section">
            <h3>📋 Test Results Display</h3>
            <div id="testResults">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle me-2"></i>
                    Kết quả test sẽ hiển thị ở đây...
                </div>
            </div>
        </div>
    </div>

    <script>
        function log(message, type = 'info') {
            const console = document.getElementById('console');
            const timestamp = new Date().toLocaleTimeString();
            const colors = {
                'info': '#0f0',
                'success': '#4caf50', 
                'error': '#f44336',
                'warning': '#ff9800'
            };
            
            console.innerHTML += `<div style="color: ${colors[type]}">[${timestamp}] ${message}</div>`;
            console.scrollTop = console.scrollHeight;
        }

        function updateStatus(type, status, message) {
            const element = document.getElementById(type + 'Status');
            const indicator = element.querySelector('.status-indicator');
            const text = element.querySelector('span:last-child');
            
            indicator.className = `status-indicator status-${status}`;
            text.textContent = message;
        }

        function clearConsole() {
            document.getElementById('console').innerHTML = '[DEBUG] Console cleared...\n';
        }

        async function testDirectAPI() {
            log('=== TESTING DIRECT API ===', 'info');
            updateStatus('api', 'warning', 'API: Testing...');
            
            try {
                const query = document.getElementById('testQuery').value;
                const status = document.getElementById('testStatus').value;
                
                const url = `index.php?action=search&api=1&q=${encodeURIComponent(query)}&status=${status}&per_page=10`;
                log(`Testing URL: ${url}`, 'info');
                
                const response = await fetch(url);
                log(`Response status: ${response.status}`, response.ok ? 'success' : 'error');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                log('Response received:', 'success');
                log(`- Success: ${data.success}`, data.success ? 'success' : 'error');
                log(`- Results count: ${data.data?.result?.length || 0}`, 'info');
                log(`- Query: ${data.search?.query}`, 'info');
                
                if (data.success && data.data && data.data.result) {
                    updateStatus('api', 'success', `API: ✓ ${data.data.result.length} results`);
                    displayTestResults(data.data.result);
                } else {
                    updateStatus('api', 'error', `API: ✗ ${data.error || 'No results'}`);
                    log(`Error: ${data.error}`, 'error');
                }
                
            } catch (error) {
                log(`API Test Failed: ${error.message}`, 'error');
                updateStatus('api', 'error', 'API: ✗ Failed');
            }
            
            log('=== API TEST COMPLETE ===', 'info');
        }

        async function testJavaScriptAPI() {
            log('=== TESTING JAVASCRIPT API ===', 'info');
            updateStatus('js', 'warning', 'JavaScript: Testing...');
            
            try {
                // Test basic JS functionality
                const features = {
                    'URLSearchParams': typeof URLSearchParams !== 'undefined',
                    'fetch': typeof fetch !== 'undefined',
                    'Promise': typeof Promise !== 'undefined',
                    'async/await': true
                };
                
                let allSupported = true;
                for (const [feature, supported] of Object.entries(features)) {
                    log(`${feature}: ${supported ? '✓' : '✗'}`, supported ? 'success' : 'error');
                    if (!supported) allSupported = false;
                }
                
                if (allSupported) {
                    // Test actual API call
                    const query = document.getElementById('testQuery').value;
                    const params = new URLSearchParams({
                        action: 'search',
                        api: '1',
                        q: query,
                        per_page: '5'
                    });
                    
                    log('Making JavaScript API call...', 'info');
                    const response = await fetch(`index.php?${params.toString()}`);
                    const data = await response.json();
                    
                    if (data.success) {
                        updateStatus('js', 'success', `JavaScript: ✓ Working`);
                        log('JavaScript API call successful!', 'success');
                    } else {
                        updateStatus('js', 'error', `JavaScript: ✗ API error`);
                        log(`API returned error: ${data.error}`, 'error');
                    }
                } else {
                    updateStatus('js', 'error', 'JavaScript: ✗ Missing features');
                }
                
            } catch (error) {
                log(`JavaScript Test Failed: ${error.message}`, 'error');
                updateStatus('js', 'error', 'JavaScript: ✗ Failed');
            }
            
            log('=== JAVASCRIPT TEST COMPLETE ===', 'info');
        }

        function testSearchPage() {
            log('=== TESTING SEARCH PAGE ===', 'info');
            updateStatus('page', 'warning', 'Page: Opening...');
            
            const query = document.getElementById('testQuery').value;
            const status = document.getElementById('testStatus').value;
            const url = `index.php?action=search&q=${encodeURIComponent(query)}&status=${status}`;
            
            log(`Opening search page: ${url}`, 'info');
            
            // Open in new tab
            const newWindow = window.open(url, '_blank');
            
            if (newWindow) {
                updateStatus('page', 'success', 'Page: ✓ Opened');
                log('Search page opened in new tab', 'success');
            } else {
                updateStatus('page', 'error', 'Page: ✗ Blocked');
                log('Failed to open search page (popup blocked?)', 'error');
            }
            
            log('=== SEARCH PAGE TEST COMPLETE ===', 'info');
        }

        function displayTestResults(results) {
            const container = document.getElementById('testResults');
            
            if (!results || results.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        No results to display
                    </div>
                `;
                return;
            }
            
            const tableRows = results.slice(0, 5).map(domain => `
                <tr>
                    <td><strong>${domain.name}</strong></td>
                    <td><span class="badge bg-${domain.status === 'active' ? 'success' : 'warning'}">${domain.status}</span></td>
                    <td>${domain.plan?.name || 'Unknown'}</td>
                    <td><small>${new Date(domain.created_on).toLocaleDateString()}</small></td>
                </tr>
            `).join('');
            
            container.innerHTML = `
                <div class="alert alert-success">
                    <i class="fas fa-check-circle me-2"></i>
                    Found ${results.length} results (showing first 5):
                </div>
                <div class="table-responsive">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>Domain</th>
                                <th>Status</th>
                                <th>Plan</th>
                                <th>Created</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // Auto-run basic checks on page load
        document.addEventListener('DOMContentLoaded', () => {
            log('Debug tool initialized', 'success');
            log('Ready for testing...', 'info');
            
            // Check if we can access the API endpoint
            fetch('index.php?action=search&api=1&q=__test__')
                .then(response => {
                    if (response.ok) {
                        log('✓ API endpoint is accessible', 'success');
                    } else {
                        log('⚠ API endpoint returned ' + response.status, 'warning');
                    }
                })
                .catch(error => {
                    log('✗ Cannot reach API endpoint: ' + error.message, 'error');
                });
        });
    </script>
</body>
</html>
