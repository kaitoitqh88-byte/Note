<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Cloudflare DNS Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .result-success { border-left: 4px solid #28a745; background-color: #d4edda; }
        .result-error { border-left: 4px solid #dc3545; background-color: #f8d7da; }
        .result-info { border-left: 4px solid #17a2b8; background-color: #d1ecf1; }
        .loading { display: none; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4><i class="fab fa-cloudflare"></i> Quick Cloudflare DNS Test</h4>
                        <p class="mb-0">Test your Cloudflare DNS lookup functionality</p>
                    </div>
                    
                    <div class="card-body">
                        <form id="testForm">
                            <div class="mb-3">
                                <label for="testDomain" class="form-label">
                                    <i class="fas fa-globe"></i> Domain Name
                                </label>
                                <input type="text" class="form-control" id="testDomain" 
                                       placeholder="example.com" required>
                                <small class="form-text text-muted">
                                    Nhập domain có trong Cloudflare account của bạn
                                </small>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" 
                                               id="includeProxied" checked>
                                        <label class="form-check-label" for="includeProxied">
                                            Include Proxied Records
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" 
                                               id="comparePublic" checked>
                                        <label class="form-check-label" for="comparePublic">
                                            Compare with Public DNS
                                        </label>
                                    </div>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-search"></i> Test Cloudflare DNS
                            </button>
                            <a href="search.php" class="btn btn-outline-secondary">
                                <i class="fas fa-external-link-alt"></i> Go to Full Tool
                            </a>
                        </form>
                        
                        <!-- Loading indicator -->
                        <div class="loading alert alert-info mt-3">
                            <i class="fas fa-spinner fa-spin"></i> 
                            Đang lấy dữ liệu từ Cloudflare API...
                        </div>
                        
                        <!-- Results area -->
                        <div id="results" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const domain = document.getElementById('testDomain').value;
            const includeProxied = document.getElementById('includeProxied').checked;
            const comparePublic = document.getElementById('comparePublic').checked;
            
            if (!domain) {
                showResult('error', 'Vui lòng nhập domain name');
                return;
            }
            
            // Show loading
            document.querySelector('.loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';
            
            // Build API URL
            const url = new URL('index.php', window.location.origin);
            url.searchParams.set('action', 'cloudflare-dns');
            url.searchParams.set('domain', domain);
            url.searchParams.set('include_proxied', includeProxied ? 'true' : 'false');
            url.searchParams.set('show_only_active', 'true');
            url.searchParams.set('compare_dns', comparePublic ? 'true' : 'false');
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    document.querySelector('.loading').style.display = 'none';
                    
                    if (data.success) {
                        showSuccessResult(data.data);
                    } else {
                        showResult('error', `API Error: ${data.error}`);
                    }
                })
                .catch(error => {
                    document.querySelector('.loading').style.display = 'none';
                    console.error('Error:', error);
                    showResult('error', `Request Failed: ${error.message}`);
                });
        });
        
        function showResult(type, message) {
            const resultsDiv = document.getElementById('results');
            const alertClass = type === 'error' ? 'result-error' : 
                              type === 'success' ? 'result-success' : 'result-info';
            
            resultsDiv.innerHTML = `
                <div class="alert ${alertClass} p-3">
                    <strong>${type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️'}</strong>
                    ${message}
                </div>
            `;
        }
        
        function showSuccessResult(data) {
            const resultsDiv = document.getElementById('results');
            
            let html = `<div class="result-success alert p-3">
                <h5><i class="fas fa-check-circle"></i> ✅ Cloudflare DNS Test Successful!</h5>
                
                <div class="row mt-3">
                    <div class="col-md-6">
                        <h6><i class="fas fa-info-circle"></i> Domain Information</h6>
                        <ul class="list-unstyled">
                            <li><strong>Domain:</strong> ${data.domain}</li>
                            <li><strong>Zone ID:</strong> <small>${data.zone_id}</small></li>
                        </ul>
                    </div>
                    
                    <div class="col-md-6">
                        <h6><i class="fas fa-chart-bar"></i> Statistics</h6>
                        <ul class="list-unstyled">
                            <li><strong>Total Records:</strong> ${data.statistics.total_records}</li>
                            <li><strong>Proxied:</strong> 🟠 ${data.statistics.proxied_records}</li>
                            <li><strong>DNS Only:</strong> ⚫ ${data.statistics.dns_only_records}</li>
                        </ul>
                    </div>
                </div>`;
            
            // DNS Records
            if (data.cloudflare_records && Object.keys(data.cloudflare_records).length > 0) {
                html += `<div class="mt-3">
                    <h6><i class="fas fa-server"></i> DNS Records by Type</h6>
                    <div class="row">`;
                
                for (const [type, records] of Object.entries(data.cloudflare_records)) {
                    html += `<div class="col-md-4 col-sm-6 mb-2">
                        <span class="badge bg-secondary">${type}</span> 
                        ${records.length} records
                    </div>`;
                }
                html += `</div></div>`;
            }
            
            // Comparison Results
            if (data.comparison) {
                const comp = data.comparison.summary;
                html += `<div class="mt-3">
                    <h6><i class="fas fa-balance-scale"></i> DNS Comparison Results</h6>
                    <div class="row">
                        <div class="col-6 col-md-3">
                            <div class="text-center p-2 bg-success text-white rounded">
                                <strong>${comp.total_matches}</strong><br>
                                <small>Matches</small>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="text-center p-2 bg-warning text-dark rounded">
                                <strong>${comp.total_mismatches}</strong><br>
                                <small>Mismatches</small>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="text-center p-2 bg-info text-white rounded">
                                <strong>${comp.cloudflare_only_count}</strong><br>
                                <small>CF Only</small>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="text-center p-2 bg-secondary text-white rounded">
                                <strong>${comp.public_only_count}</strong><br>
                                <small>Public Only</small>
                            </div>
                        </div>
                    </div>
                </div>`;
                
                if (comp.total_mismatches > 0) {
                    html += `<div class="alert alert-warning mt-2">
                        <i class="fas fa-exclamation-triangle"></i> 
                        <strong>Warning:</strong> Found ${comp.total_mismatches} DNS record mismatches. 
                        This could indicate DNS propagation issues or configuration differences.
                    </div>`;
                }
            }
            
            html += `<div class="mt-3 text-end">
                <small class="text-muted">
                    <i class="fas fa-clock"></i> Test completed at ${new Date().toLocaleString()}
                </small>
            </div>`;
            
            html += `</div>`;
            
            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
