<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>🔧 JavaScript Test for Domain Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; background: white; border-radius: 10px; border-left: 4px solid #28a745; }
        .console-output { background: #1e2124; color: #00ff41; padding: 15px; border-radius: 8px; font-family: 'Roboto Mono', monospace; max-height: 400px; overflow-y: auto; white-space: pre-wrap; }
        .test-btn { margin: 5px; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .warning { color: #ffc107; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1><i class="fas fa-code me-2"></i>JavaScript Test Console</h1>
        
        <div class="test-section">
            <h3>🚀 Direct API Tests</h3>
            <div class="row">
                <div class="col-md-6">
                    <button class="btn btn-primary test-btn" onclick="testBasicAPI()">
                        <i class="fas fa-globe me-1"></i>Test Basic API Call
                    </button>
                    <button class="btn btn-success test-btn" onclick="testSearchAPI()">
                        <i class="fas fa-search me-1"></i>Test Search API
                    </button>
                    <button class="btn btn-info test-btn" onclick="testAdvancedAPI()">
                        <i class="fas fa-cogs me-1"></i>Test Advanced API
                    </button>
                    <button class="btn btn-warning test-btn" onclick="testJSImplementation()">
                        <i class="fas fa-code me-1"></i>Test JavaScript Implementation
                    </button>
                    <button class="btn btn-secondary test-btn" onclick="clearConsole()">
                        <i class="fas fa-trash me-1"></i>Clear Console
                    </button>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Test Query:</label>
                        <input type="text" id="testQuery" class="form-control" placeholder="Enter search term" value="">
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="testUseCache" checked>
                        <label class="form-check-label" for="testUseCache">Use Cache</label>
                    </div>
                </div>
            </div>
            <div id="console" class="console-output mt-3">
=== JavaScript Test Console ===
Ready to test API functionality...

</div>
        </div>

        <div class="test-section">
            <h3>🔗 Integration Test</h3>
            <div class="alert alert-info">
                <i class="fas fa-info-circle me-2"></i>
                Open the search page and check if domains load automatically
            </div>
            <div class="text-center">
                <a href="index.php?action=search" class="btn btn-lg btn-primary me-3" target="_blank">
                    <i class="fas fa-external-link-alt me-2"></i>Open Search Page
                </a>
                <button class="btn btn-lg btn-outline-primary" onclick="testSearchPageInFrame()">
                    <i class="fas fa-window-maximize me-2"></i>Load in Frame
                </button>
            </div>
            
            <div class="mt-3" id="frameContainer" style="display:none;">
                <iframe id="searchFrame" src="" style="width: 100%; height: 600px; border: 1px solid #ddd; border-radius: 8px;"></iframe>
            </div>
        </div>
    </div>

    <script>
        let consoleElement = document.getElementById('console');
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const colors = {
                info: '#00ff41',
                success: '#00ff41', 
                error: '#ff4757',
                warning: '#ffa502'
            };
            
            const prefix = type === 'error' ? '❌' : type === 'warning' ? '⚠️ ' : type === 'success' ? '✅' : 'ℹ️ ';
            consoleElement.innerHTML += `[${timestamp}] ${prefix} ${message}\n`;
            consoleElement.scrollTop = consoleElement.scrollHeight;
            
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function clearConsole() {
            consoleElement.innerHTML = '=== JavaScript Test Console ===\nConsole cleared...\n\n';
        }

        async function testBasicAPI() {
            log('Testing basic API endpoint...', 'info');
            
            try {
                const response = await fetch('index.php?action=search&api=1&q=&page=1&per_page=3');
                log(`Response status: ${response.status}`, 'info');
                
                const contentType = response.headers.get('content-type');
                log(`Content-Type: ${contentType}`, 'info');
                
                if (contentType && contentType.includes('application/json')) {
                    const data = await response.json();
                    log('API response received successfully', 'success');
                    log(`Success: ${data.success}`, 'info');
                    log(`Results count: ${data.data?.result?.length || 0}`, 'info');
                    log(`Total domains: ${data.data?.result_info?.total_count || 0}`, 'info');
                    
                    if (data.data?.result && data.data.result.length > 0) {
                        log(`Sample domain: ${data.data.result[0].name}`, 'success');
                        log(`Domain status: ${data.data.result[0].status}`, 'info');
                        log(`Domain plan: ${data.data.result[0].plan?.name || 'N/A'}`, 'info');
                    } else {
                        log('No domains returned in result', 'warning');
                    }
                } else {
                    const text = await response.text();
                    log('Response is not JSON:', 'error');
                    log(text.substring(0, 200) + '...', 'error');
                }
                
            } catch (error) {
                log(`API Error: ${error.message}`, 'error');
            }
        }

        async function testSearchAPI() {
            const query = document.getElementById('testQuery').value || 'test';
            log(`Testing search API with query: "${query}"`, 'info');
            
            try {
                const url = `index.php?action=search&api=1&q=${encodeURIComponent(query)}&page=1&per_page=5&include_stats=true`;
                log(`Request URL: ${url}`, 'info');
                
                const response = await fetch(url);
                const data = await response.json();
                
                log(`Query returned ${data.data?.result?.length || 0} results`, 'success');
                
                if (data.search?.execution_time_ms) {
                    log(`Execution time: ${data.search.execution_time_ms}ms`, 'info');
                }
                
                if (data.search?.cache_hit !== undefined) {
                    log(`Cache hit: ${data.search.cache_hit ? 'YES' : 'NO'}`, 'info');
                }
                
                if (data.data?.result) {
                    log('Domain results:', 'success');
                    data.data.result.forEach((domain, index) => {
                        log(`  ${index + 1}. ${domain.name} (${domain.status}) - Plan: ${domain.plan?.name || 'N/A'}`, 'info');
                    });
                }
                
                if (data.search?.domain_statistics) {
                    const stats = data.search.domain_statistics;
                    log(`Statistics: ${stats.total_domains} total domains`, 'success');
                    log(`Active: ${stats.by_status?.active || 0}, Pending: ${stats.by_status?.pending || 0}`, 'info');
                }
                
            } catch (error) {
                log(`Search API Error: ${error.message}`, 'error');
            }
        }

        async function testAdvancedAPI() {
            log('Testing advanced API features...', 'info');
            
            try {
                // Test with sorting and filtering
                const url = 'index.php?action=search&api=1&q=&page=1&per_page=5&sort_by=name&sort_order=asc&status_filter=active&include_stats=true';
                log(`Testing: ${url}`, 'info');
                
                const response = await fetch(url);
                const data = await response.json();
                
                log('Advanced features test results:', 'success');
                log(`Domains returned: ${data.data?.result?.length || 0}`, 'info');
                log(`Sorted by name: ${data.search?.sorting?.by || 'not specified'}`, 'info');
                log(`Filter applied: ${data.search?.filters?.status || 'none'}`, 'info');
                
                // Test export functionality
                log('Testing export functionality...', 'info');
                const exportUrl = 'index.php?action=search&api=1&export=csv&q=&per_page=3';
                const exportResponse = await fetch(exportUrl);
                const exportData = await exportResponse.text();
                
                if (exportData.includes('domain_name')) {
                    log('CSV export working correctly', 'success');
                    const lines = exportData.split('\n').length - 1;
                    log(`CSV contains ${lines} lines`, 'info');
                } else {
                    log('CSV export may have issues', 'warning');
                }
                
            } catch (error) {
                log(`Advanced API Error: ${error.message}`, 'error');
            }
        }

        async function testJSImplementation() {
            log('Testing JavaScript implementation...', 'info');
            
            try {
                // Test if we can implement the same logic as search.php
                log('Creating mock DomainSearch class...', 'info');
                
                const mockDomainSearch = {
                    performSearch: async function(page = 1) {
                        const url = `index.php?action=search&api=1&q=&page=${page}&per_page=5`;
                        const response = await fetch(url);
                        return await response.json();
                    },
                    
                    renderResults: function(data) {
                        if (!data || !data.data || !data.data.result) {
                            return '<div class="alert alert-warning">No results to render</div>';
                        }
                        
                        const domains = data.data.result;
                        let html = '<table class="table table-striped"><thead><tr><th>Domain</th><th>Status</th><th>Plan</th></tr></thead><tbody>';
                        
                        domains.forEach(domain => {
                            html += `<tr>
                                <td>${domain.name}</td>
                                <td><span class="badge bg-${domain.status === 'active' ? 'success' : 'warning'}">${domain.status}</span></td>
                                <td>${domain.plan?.name || 'N/A'}</td>
                            </tr>`;
                        });
                        
                        html += '</tbody></table>';
                        return html;
                    }
                };
                
                log('Mock class created successfully', 'success');
                
                // Test search functionality
                log('Testing search functionality...', 'info');
                const searchResult = await mockDomainSearch.performSearch(1);
                
                if (searchResult && searchResult.success) {
                    log('Search method working correctly', 'success');
                    log(`Returned ${searchResult.data?.result?.length || 0} domains`, 'info');
                    
                    // Test render functionality
                    const html = mockDomainSearch.renderResults(searchResult);
                    if (html.includes('<table')) {
                        log('Render method working correctly', 'success');
                        log(`Generated HTML: ${html.length} characters`, 'info');
                    } else {
                        log('Render method may have issues', 'warning');
                    }
                } else {
                    log('Search method returned error', 'error');
                }
                
                log('JavaScript implementation test completed', 'success');
                
            } catch (error) {
                log(`JavaScript Implementation Error: ${error.message}`, 'error');
            }
        }

        function testSearchPageInFrame() {
            const frameContainer = document.getElementById('frameContainer');
            const frame = document.getElementById('searchFrame');
            
            frame.src = 'index.php?action=search';
            frameContainer.style.display = 'block';
            
            log('Loading search page in frame...', 'info');
            
            frame.onload = function() {
                log('Search page loaded in frame', 'success');
                log('Check the frame below to see if domains display automatically', 'info');
            };
        }

        // Auto-run basic API test when page loads
        window.onload = function() {
            log('Page loaded, running basic API test...', 'info');
            setTimeout(testBasicAPI, 1000);
        };
    </script>
</body>
</html>
